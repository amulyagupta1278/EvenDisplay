    .actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      padding: 11px 22px;
      border-radius: 9999px;
      font-size: 15px;
      border: 1px solid transparent;

    .btn-primary { background: var(--action-blue); color: #ffffff; }

    .btn-secondary { color: var(--action-blue); border-color: var(--action-blue); }
